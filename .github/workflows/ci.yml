name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Public checks and tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Check repository hygiene
        run: Scripts/check-public-repo.sh

      - name: Run tests
        run: Scripts/test.sh
